name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json
      # Tooling (pnpm 11) needs Node 22.13+; the shipped bundle still targets Node 20 (checked below).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Fail if the committed bundle is stale
        run: |
          test -z "$(git status --porcelain -- dist)" || { git status --porcelain -- dist; echo "dist is stale: run pnpm build and commit"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test the bundle on Node 20
        run: |
          node --version
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | DOMAIN_ENGINE_HOME="$RUNNER_TEMP/dne" timeout 20 node dist/index.js || true)
          echo "$out" | grep -q '"name":"check_domains"' || { echo "$out"; echo "bundle did not list tools on Node 20"; exit 1; }
